spring:
  mail:
    # SMTP padrão do ambiente (em desenvolvimento, o Mailpit do Docker Compose). Cada escritório pode usar o próprio
    # SMTP pela Central de Integrações.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
  application:
    name: erpadv-backend
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: ${DOCUMENTS_MAX_MB:25}MB
      max-request-size: ${DOCUMENTS_MAX_REQUEST_MB:30}MB

server:
  port: ${SERVER_PORT:8085}
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,firestore
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ERPAdv
    version: 0.1.0

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:demo-erpadv}
    # Caminho do JSON da service account (montado como volume/secret, nunca dentro da imagem).
    # Vazio = Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS ou metadata server).
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:demo-erpadv.appspot.com}
    # true quando FIRESTORE_EMULATOR_HOST / FIREBASE_AUTH_EMULATOR_HOST apontam para o Emulator Suite
    emulator: ${FIREBASE_USE_EMULATOR:false}
    emulator-public-auth-url: ${FIREBASE_EMULATOR_PUBLIC_AUTH_URL:}
  security:
    # Chave AES-256 (base64, 32 bytes) para criptografar CPF/CNPJ/RG. Obrigatória.
    data-encryption-key: ${DATA_ENCRYPTION_KEY:}
    # Chave HMAC (base64, >= 32 bytes) para tokens de busca de dados sensíveis. Obrigatória.
    search-hmac-key: ${SEARCH_HMAC_KEY:}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:300}
    profile-cache-seconds: ${PROFILE_CACHE_SECONDS:60}
    require-email-verified: ${REQUIRE_EMAIL_VERIFIED:true}
    # Recusa iniciar com as chaves de desenvolvimento publicadas no .env.example
    production: ${APP_PRODUCTION:false}
  jobs:
    # Alertas de prazos (10/5/3/1/0 dias) e lembretes de agenda. Desligue em réplicas sem agendamento.
    enabled: ${JOBS_ENABLED:true}
    deadline-alerts-cron: ${DEADLINE_ALERTS_CRON:0 5 * * * *}
    appointment-reminders-ms: ${APPOINTMENT_REMINDERS_MS:300000}
    # Cobrança das assinaturas: fim da avaliação, faturas, atrasos e suspensão (horário de Brasília)
    billing-cron: ${BILLING_CRON:0 0 6 * * *}
  # Avaliação gratuita dos novos escritórios (plano e dias)
  billing:
    trial-plan: ${BILLING_TRIAL_PLAN:ENTERPRISE}
    trial-days: ${BILLING_TRIAL_DAYS:14}
  mail:
    from: ${MAIL_FROM:}
  # OCR de documentos digitalizados (Tesseract instalado na imagem do backend)
  ocr:
    tesseract-path: ${OCR_TESSERACT_PATH:tesseract}
    languages: ${OCR_LANGUAGES:por}
  # IA jurídica (Anthropic/Claude) — chave só no backend; o escritório também pode cadastrar a própria em Integrações.
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5-5}
    base-url: ${AI_BASE_URL:}
    # "default": se o modelo recusar por política de segurança, a API tenta outro modelo na mesma chamada; "off" desliga.
    fallbacks: ${AI_FALLBACKS:default}
  integrations:
    # Consultas automáticas ao DJEN/DataJud (desligadas: o acompanhamento é feito pelo advogado).
    judicial-sync-enabled: ${INTEGRATIONS_JUDICIAL_SYNC:false}
    # URL pública do sistema (retorno do OAuth do Google).
    public-app-url: ${PUBLIC_APP_URL:https://localhost:8443}
    datajud:
      # Chave pública divulgada pelo CNJ em https://datajud-wiki.cnj.jus.br/api-publica/acesso (o escritório pode
      # informar outra na Central de Integrações).
      api-key: ${DATAJUD_API_KEY:}
      base-url: ${DATAJUD_BASE_URL:https://api-publica.datajud.cnj.jus.br}
    djen:
      base-url: ${DJEN_BASE_URL:https://comunicaapi.pje.jus.br}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
    whatsapp:
      graph-url: ${WHATSAPP_GRAPH_URL:https://graph.facebook.com/v20.0}
    zapsign:
      url: ${ZAPSIGN_URL:https://api.zapsign.com.br}
      sandbox-url: ${ZAPSIGN_SANDBOX_URL:https://sandbox.api.zapsign.com.br}
  documents:
    # Limite por arquivo enviado à central documental (MB).
    max-size-mb: ${DOCUMENTS_MAX_MB:25}
  platform:
    # E-mails com acesso ao painel master (desenvolvedor). Separados por vírgula.
    master-emails: ${PLATFORM_MASTER_EMAILS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    root: INFO
    br.com.erpadv: INFO
    AUDIT: INFO
